<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsługa Testów i Kwestionariuszy - Eksport CSV</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-light: #eff6ff;
            --accent-border: #bfdbfe;
            --success: #10b981;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        p.desc {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .upload-section {
            background: var(--card-bg);
            border: 2px dashed var(--accent-border);
            border-radius: var(--radius);
            padding: 35px 20px;
            text-align: center;
            margin-bottom: 24px;
            transition: border-color 0.2s, background-color 0.2s;
            cursor: pointer;
        }

        .upload-section:hover, .upload-section.dragover {
            border-color: var(--primary);
            background-color: var(--accent-light);
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--success);
        }
        .btn-success:hover {
            background-color: #059669;
        }

        .sticky-toolbar {
            position: sticky;
            top: 12px;
            z-index: 100;
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .progress-container {
            flex-grow: 1;
            min-width: 200px;
        }

        .progress-bar-bg {
            background: var(--border-color);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .question-card.answered {
            border-left: 5px solid var(--success);
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            gap: 10px;
        }

        .question-number {
            color: var(--primary);
            font-weight: 700;
            white-space: nowrap;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 12px;
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            user-select: none;
            transition: all 0.15s ease;
            min-height: 48px;
        }

        .option-label:hover {
            background: var(--accent-light);
            border-color: var(--accent-border);
        }

        .option-label input[type="radio"] {
            display: none;
        }

        .option-label.selected {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 600;
        }

        .actions-footer {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .sticky-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="test-title">Wczytaj kwestionariusz / test JSON</h1>
        <p class="desc" id="test-desc">Wgraj plik JSON z pytaniami, aby rozpocząć wypełnianie. Po wygenerowaniu formularza będziesz mógł pobrać plik CSV z punktacją.</p>
    </header>

    <div class="upload-section" id="drop-zone">
        <p style="font-size: 1.1rem; font-weight: 500; margin-bottom: 8px;">Przeciągnij i upuść plik JSON tutaj</p>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">lub</p>
        <label for="json-input" class="btn">Wybierz plik z dysku</label>
        <input type="file" id="json-input" accept=".json">
    </div>

    <div id="test-container" class="hidden">
        <div class="sticky-toolbar">
            <div class="progress-container">
                <div class="progress-text">Postęp: <span id="answered-count">0</span> / <span id="total-count">0</span></div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>
            <button class="btn btn-success" id="export-btn">Pobierz wyniki CSV</button>
        </div>

        <div id="questions-list"></div>

        <div class="actions-footer">
            <button class="btn btn-success" id="export-btn-footer" style="padding: 12px 30px; font-size: 1rem;">Pobierz wyniki CSV</button>
        </div>
    </div>

    <script>
        let currentTestData = null;
        let userAnswers = {}; // { questionIndex: { points: Number, optionText: String } }

        const dropZone = document.getElementById('drop-zone');
        const jsonInput = document.getElementById('json-input');
        const testContainer = document.getElementById('test-container');
        const questionsList = document.getElementById('questions-list');
        const testTitle = document.getElementById('test-title');
        const testDesc = document.getElementById('test-desc');
        const answeredCountEl = document.getElementById('answered-count');
        const totalCountEl = document.getElementById('total-count');
        const progressFill = document.getElementById('progress-fill');
        const exportBtn = document.getElementById('export-btn');
        const exportBtnFooter = document.getElementById('export-btn-footer');

        // Obsługa przeciągania i upuszczania plików
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        jsonInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.json')) {
                alert('Proszę wybrać plik w formacie .json');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (!parsed.questions || !Array.isArray(parsed.questions)) {
                        alert('Nieprawidłowy format JSON: brak tablicy "questions".');
                        return;
                    }
                    loadTest(parsed);
                } catch (err) {
                    alert('Błąd podczas odczytu pliku JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function loadTest(data) {
            currentTestData = data;
            userAnswers = {};

            testTitle.textContent = data.title || 'Kwestionariusz / Test';
            testDesc.textContent = data.description || '';

            renderQuestions();
            updateProgress();

            dropZone.classList.add('hidden');
            testContainer.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuestions() {
            questionsList.innerHTML = '';
            totalCountEl.textContent = currentTestData.questions.length;

            currentTestData.questions.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${qIndex}`;

                const title = document.createElement('div');
                title.className = 'question-title';
                title.innerHTML = `<span class="question-number">${qIndex + 1}.</span><span>${escapeHtml(q.text)}</span>`;
                card.appendChild(title);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                const options = q.options || [];
                const pointsMap = q.points || {};

                options.forEach((optText, oIndex) => {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    // Odczytanie liczby punktów dla danej opcji z mapy 'points' w JSON
                    let ptValue = 0;
                    if (pointsMap && pointsMap[optText] !== undefined) {
                        ptValue = pointsMap[optText];
                    } else {
                        ptValue = oIndex + 1; // domyślne narastające punktowanie w razie braku mapy
                    }

                    label.innerHTML = `
                        <input type="radio" name="q_${qIndex}" value="${escapeHtml(optText)}" data-points="${ptValue}">
                        <span>${escapeHtml(optText)}</span>
                    `;

                    label.addEventListener('click', () => {
                        selectOption(qIndex, optText, ptValue, card, optionsGrid, label);
                    });

                    optionsGrid.appendChild(label);
                });

                card.appendChild(optionsGrid);
                questionsList.appendChild(card);
            });
        }

        function selectOption(qIndex, optionText, points, cardEl, gridEl, selectedLabel) {
            userAnswers[qIndex] = {
                questionNum: qIndex + 1,
                questionText: currentTestData.questions[qIndex].text,
                selectedOption: optionText,
                points: points
            };

            // Zmiana wyglądu zaktualizowanego pytania
            const labels = gridEl.querySelectorAll('.option-label');
            labels.forEach(l => l.classList.remove('selected'));
            selectedLabel.classList.add('selected');
            cardEl.classList.add('answered');

            updateProgress();
        }

        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            const totalCount = currentTestData ? currentTestData.questions.length : 0;
            
            answeredCountEl.textContent = answeredCount;
            const percentage = totalCount > 0 ? (answeredCount / totalCount) * 100 : 0;
            progressFill.style.width = `${percentage}%`;
        }

        function downloadCSV() {
            if (!currentTestData) return;

            const totalCount = currentTestData.questions.length;
            const answeredCount = Object.keys(userAnswers).length;

            if (answeredCount < totalCount) {
                const confirmExport = confirm(`Uzupełniono ${answeredCount} z ${totalCount} pytań. Czy na pewno chcesz pobrać plik CSV z dotychczasowymi odpowiedziami?`);
                if (!confirmExport) return;
            }

            let csvRows = [];
            // Nagłówki pliku CSV
            csvRows.push(['Numer pytania', 'Punkty (Cyfrowo)', 'Treść pytania', 'Wybrana odpowiedź']);

            for (let i = 0; i < totalCount; i++) {
                const ans = userAnswers[i];
                const qNum = i + 1;
                const qText = currentTestData.questions[i].text;

                if (ans) {
                    csvRows.push([
                        qNum,
                        ans.points,
                        `"${qText.replace(/"/g, '""')}"`,
                        `"${ans.selectedOption.replace(/"/g, '""')}"`
                    ]);
                } else {
                    csvRows.push([
                        qNum,
                        'Brak odpowiedzi',
                        `"${qText.replace(/"/g, '""')}"`,
                        '--'
                    ]);
                }
            }

            // UTF-8 BOM (\uFEFF) gwarantuje poprawne wyświetlanie polskich znaków w Excelu
            const csvString = '\uFEFF' + csvRows.map(e => e.join(';')).join('\n');
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            const safeTitle = (currentTestData.title || 'wynik_testu').toLowerCase().replace(/[^a-z0-9aząśęćżźńół]+/gi, '_');
            link.setAttribute('href', url);
            link.setAttribute('download', `wyniki_${safeTitle}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        exportBtn.addEventListener('click', downloadCSV);
        exportBtnFooter.addEventListener('click', downloadCSV);

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
