<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czytnik Wiadomości</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --text-main: #e3e6ed;
            --text-muted: #8892b0;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --border: #222530;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        header {
            margin-bottom: 50px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 25px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 500;
            margin: 0 0 20px 0;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        button.active, button:hover {
            border-color: var(--accent);
            color: var(--text-main);
            background-color: rgba(79, 70, 229, 0.1);
        }

        .loader {
            text-align: center;
            color: var(--text-muted);
            margin: 50px 0;
            font-size: 0.9rem;
            display: none;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        article {
            animation: fadeIn 0.4s ease forwards;
        }

        .article-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-title {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
            font-weight: 500;
            line-height: 1.4;
        }

        .article-title a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .article-title a:hover {
            color: var(--accent-hover);
        }

        .article-description {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>

        // --- AUTOMATYCZNE TŁUMACZENIE NA JĘZYK POLSKI ---
        async function translateText(text) {
            if (!text) return '';
            const cleanText = text.replace(/<[^>]*>/g, '').trim();
            if (!cleanText) return '';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pl&dt=t&q=${encodeURIComponent(cleanText)}`);
                const data = await res.json();
                if (data && data[0]) {
                    return data[0].map(item => item[0]).join('');
                }
            } catch (e) {}
            return text;
        }

        // --- POMOCNICZE FUNKCJE KALENDARZOWE NA ŻYWO ---
        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function getZodiacSign(day, month) {
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "Baran ♈︎";
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "Byk ♉︎";
            if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return "Bliźnięta ♊︎";
            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return "Rak ♋︎";
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "Lew ♌︎";
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "Panna ♍︎";
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return "Waga ♎︎";
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return "Skorpion ♏︎";
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return "Strzelec ♐︎";
            if ((month == 12 || month == 1) && (month == 12 ? day >= 22 : day <= 19)) return "Koziorożec ♑︎";
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "Wodnik ♒︎";
            return "Ryby ♓︎";
        }

        function getYearStats(date) {
            const year = date.getFullYear();
            const end = new Date(year, 11, 31);
            const diffDays = Math.ceil((end - date) / (1000 * 60 * 60 * 24));
            return { diffDays };
        }

        function getMoonPhase(date) {
            // Obliczenia astronomiczne: cykl synodyczny 29.53058867 dni od nowiu 2000-01-06 18:14 UTC
            const synodic = 29.53058867;
            const known = Date.UTC(2000, 0, 6, 18, 14) / 86400000;
            const days = date.getTime() / 86400000 - known;
            let age = days % synodic;
            if (age < 0) age += synodic;
            const illum = Math.round((1 - Math.cos(2 * Math.PI * age / synodic)) / 2 * 100);
            let name = '';
            if (age < 1.5 || age > synodic - 1.5) name = 'Nów 🌑';
            else if (age < 7.4) name = 'Dąży do pierwszej kwadry 🌒';
            else if (age < 8.9) name = 'Pierwsza kwadra 🌓';
            else if (age < 14.8) name = 'Dąży do pełni 🌔';
            else if (age < 16.3) name = 'Pełnia 🌕';
            else if (age < 22.2) name = 'Dąży do ostatniej kwadry 🌖';
            else if (age < 23.7) name = 'Ostatnia kwadra 🌗';
            else name = 'Dąży do nowiu 🌘';
            return { name, illum, age: Math.round(age * 10) / 10 };
        }

        async function fetchSunPL(date) {
            const iso = date.toISOString().split('T')[0];
            try {
                const r = await fetch(`https://api.sunrise-sunset.org/json?lat=49.784&lng=22.767&date=${iso}&formatted=0`);
                const d = await r.json();
                if (d?.status === 'OK' && d.results) {
                    const fmt = (s) => new Date(s).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
                    const sunrise = fmt(d.results.sunrise);
                    const sunset = fmt(d.results.sunset);
                    const secs = d.results.day_length;
                    const h = Math.floor(secs / 3600), m = Math.round((secs % 3600) / 60);
                    return { sunrise, sunset, len: `${h} godz. ${m} min` };
                }
            } catch (e) {}
            return null;
        }

        async function fetchHolidaysPL(date) {
            const year = date.getFullYear();
            try {
                const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/PL`);
                const d = await r.json();
                if (Array.isArray(d)) {
                    const todayStr = date.toISOString().split('T')[0];
                    const todayHol = d.filter(h => h.date === todayStr);
                    const upcoming = d.filter(h => h.date > todayStr).slice(0, 5).map(h => {
                        const hd = new Date(h.date + 'T00:00:00');
                        const diff = Math.ceil((hd - date) / 86400000);
                        const label = hd.toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' });
                        return { label, name: h.localName || h.name, diff };
                    });
                    return { todayHol, upcoming };
                }
            } catch (e) {}
            return { todayHol: [], upcoming: [] };
        }

        async function fillCalendarWidget(today) {
            // Słońce na żywo (Przemyśl, podkarpackie)
            try {
                const sun = await fetchSunPL(today);
                const el = document.getElementById('cal-sun');
                if (el && sun) el.innerHTML = `🌅 Wschód: ${sun.sunrise} &nbsp;|&nbsp; 🌇 Zachód: ${sun.sunset}<br>⏳ Długość dnia: ${sun.len}`;
            } catch (e) {}
            // Najbliższe święta państwowe na żywo
            try {
                const hol = await fetchHolidaysPL(today);
                const elN = document.getElementById('cal-najblizsze');
                if (elN && hol.upcoming.length > 0) {
                    elN.innerHTML = hol.upcoming.map(h => `<li><strong>${h.label}:</strong> ${h.name} (za ${h.diff} dni)</li>`).join('');
                } else if (elN) {
                    elN.innerHTML = '<li>Brak danych o nadchodzących świętach.</li>';
                }
            } catch (e) {}
        }

        // --- OBSŁUGA GESTÓW ---
        let touchstartX = 0;
        let touchstartY = 0;
        let touchendX = 0;
        let touchendY = 0;

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleGesture();
        }, { passive: true });

        function handleGesture() {
            const diffX = touchendX - touchstartX;
            const diffY = touchendY - touchstartY;
            const swipeThreshold = 60;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold) {
                const keys = Object.keys(feeds);
                const activeBtn = document.querySelector('nav button.active');
                if (!activeBtn) return;
                
                const currentKey = activeBtn.id.replace('btn-', '');
                let currentIndex = keys.indexOf(currentKey);
                
                if (diffX > 0) {
                    currentIndex = (currentIndex - 1 + keys.length) % keys.length;
                } else {
                    currentIndex = (currentIndex + 1) % keys.length;
                }
                
                loadFeed(keys[currentIndex]);
            }
        }

        // --- POMOCNICZE FUNKCJE DAT ---
        function getTimestamp(dateStr) {
            if (!dateStr) return 0;
            if (dateStr.includes('/')) {
                const match = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                if (match) {
                    return new Date(`${match[3]}-${match[1]}-${match[2]}`).getTime();
                }
            }
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? 0 : d.getTime();
        }

        function parseFeedDate(dateStr) {
            if (!dateStr) return 'Brak daty';
            if (dateStr.includes('/')) {
                const match = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                if (match) {
                    const dateObj = new Date(`${match[3]}-${match[1]}-${match[2]}`);
                    if (!isNaN(dateObj)) return formatDate(dateObj);
                }
            }
            const dateObj = new Date(dateStr);
            if (!isNaN(dateObj)) return formatDate(dateObj);
            return dateStr.replace(/^[a-złżóćęąśń.,\s]+/i, '');
        }

        function formatDate(dateObj) {
            return dateObj.toLocaleDateString('pl-PL', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // --- RENDEROWANIE ARTYKUŁÓW (NEVER ENDING SCROLLING) ---
        function renderArticles(items, container, append = false, isCalendar = false) {
            if (!append) {
                container.innerHTML = '';
                displayedCount = 0;

                // Jeśli to zakładka kalendarz, wygeneruj widget jak kalendarzswiat.pl + dane na żywo z internetu
                if (isCalendar) {
                    const today = new Date();
                    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    const dateFormatted = today.toLocaleDateString('pl-PL', options);
                    const capitalizedDate = dateFormatted.charAt(0).toUpperCase() + dateFormatted.slice(1);

                    const dayOfYear = getDayOfYear(today);
                    const weekNum = getWeekNumber(today);
                    const stats = getYearStats(today);
                    const zodiac = getZodiacSign(today.getDate(), today.getMonth() + 1);
                    const moon = getMoonPhase(today);
                    const przyslowie = przyslowia[dayOfYear % przyslowia.length];
                    const cytat = cytaty[dayOfYear % cytaty.length];

                    const widget = document.createElement('div');
                    widget.style.cssText = 'background: #161920; border: 1px solid var(--border); border-radius: 10px; padding: 25px; margin-bottom: 40px;';
                    widget.innerHTML = `
                        <p style="color: var(--text-main); font-weight: 700; font-size: 1.6rem; margin: 0 0 4px 0;">${capitalizedDate}</p>
                        <p style="color: var(--text-muted); font-weight: 400; font-size: 0.9rem; margin: 0 0 15px 0;">${dayOfYear}. dzień roku &bull; Tydzień ${weekNum} &bull; ${stats.diffDays} dni do końca roku</p>

                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; font-size: 0.95rem; color: var(--text-muted);">
                            <div>
                                <strong style="color: var(--text-main);">Znak zodiaku:</strong> ${zodiac}<br><br>
                                <strong style="color: var(--text-main);">Przysłowie na dziś:</strong><br><em>${przyslowie}</em>
                            </div>
                            <div>
                                <strong style="color: var(--text-main);">Słońce i dzień:</strong><br>
                                <span id="cal-sun">⏳ Pobieranie…</span><br>
                                🌙 <strong style="color: var(--text-main);">Faza Księżyca:</strong> ${moon.name} (${moon.illum}% jasności)
                            </div>
                        </div>

                        <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                            <strong style="color: var(--text-main);">Najbliższe ważne daty (święta PL, na żywo):</strong>
                            <ul id="cal-najblizsze" style="margin: 5px 0 0 20px; padding: 0; color: var(--text-muted); font-size: 0.9rem;">
                                <li>⏳ Pobieranie…</li>
                            </ul>
                        </div>

                        <div style="margin-top: 20px; background: rgba(79, 70, 229, 0.08); padding: 12px 16px; border-radius: 6px; border-left: 3px solid var(--accent);">
                            <strong style="color: var(--text-main);">Cytat dnia:</strong><br>
                            <em style="color: var(--text-main);">${cytat.t}</em><br>
                            <small style="color: var(--text-muted);">— ${cytat.a}</small>
                        </div>
                    `;
                    container.appendChild(widget);
                    // Uzupełnij dane z internetu bez blokowania listy artykułów
                    fillCalendarWidget(today);
                }
            }

            const slice = items.slice(displayedCount, displayedCount + batchSize);
            if (slice.length === 0) return;

            slice.forEach(item => {
                const article = document.createElement('article');
                const pubDate = parseFeedDate(item.pubDate);
                const sourceName = item.sourceName || 'Wiadomości';

                let cleanDescription = item.description || '';
                cleanDescription = cleanDescription.replace(/<[^>]*>/g, '').trim();

                article.innerHTML = `
                    <div class="article-meta" translate="no">${pubDate} &bull; ${sourceName}</div>
                    <h2 class="article-title">
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                    </h2>
                    ${cleanDescription ? `<p class="article-description">${cleanDescription}</p>` : ''}
                `;
                container.appendChild(article);
            });

            displayedCount += slice.length;
        }

        // --- OBSŁUGA SCROLLOWANIA (NIESKOŃCZONE przewijanie) ---
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 400) {
                if (currentItems.length > 0 && displayedCount < currentItems.length) {
                    const feedContainer = document.getElementById('feed');
                    renderArticles(currentItems, feedContainer, true, currentSourceKey === 'kalendarz');
                }
            }
        });

        // --- GŁÓWNA FUNKCJA POBIERANIA Z TŁUMACZENIEM I CACHINGIEM ---
        async function loadFeed(sourceKey) {
            currentSourceKey = sourceKey;
            const loader = document.getElementById('loader');
            const feedContainer = document.getElementById('feed');
            
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${sourceKey}`).classList.add('active');

            // Jeśli dane są w pamięci podręcznej, otwórz natychmiast (0ms)
            if (feedCache[sourceKey]) {
                loader.style.display = 'none';
                currentItems = feedCache[sourceKey];
                renderArticles(currentItems, feedContainer, false, sourceKey === 'kalendarz');
                return;
            }

            loader.style.display = 'block';
            feedContainer.innerHTML = '';
            displayedCount = 0;
            currentItems = [];
            
            try {
                const urls = feeds[sourceKey];
                const fetchPromises = urls.map(async (url) => {
                    try {
                        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                        if (!response.ok) return null;
                        const data = await response.json();
                        if (data.status !== 'ok' || !data.items) return null;
                        
                        const sourceName = feedSources[url] || data.feed?.title || 'Wiadomości';

                        // Automatyczne tłumaczenie tytułów i opisów na język polski
                        const translatedItems = await Promise.all(data.items.map(async (item) => {
                            let title = item.title || '';
                            let description = item.description || '';
                            
                            try {
                                if (title) title = await translateText(title);
                                if (description) description = await translateText(description);
                            } catch (err) {}

                            return {
                                ...item,
                                title,
                                description,
                                sourceName
                            };
                        }));

                        return translatedItems;
                    } catch (e) {
                        return null;
                    }
                });

                const results = await Promise.all(fetchPromises);
                
                let combinedItems = [];
                results.forEach(items => {
                    if (items) combinedItems = combinedItems.concat(items);
                });
                
                loader.style.display = 'none';
                
                if (combinedItems.length === 0 && sourceKey !== 'kalendarz') {
                    feedContainer.innerHTML = '<p class="text-muted">Nie udało się wczytać żadnych artykułów.</p>';
                    return;
                }

                combinedItems.sort((a, b) => getTimestamp(b.pubDate) - getTimestamp(a.pubDate));
                
                // Zapisz w cache przetłumaczone artykuły
                feedCache[sourceKey] = combinedItems;
                currentItems = combinedItems;
                renderArticles(currentItems, feedContainer, false, sourceKey === 'kalendarz');

            } catch (error) {
                loader.style.display = 'none';
                feedContainer.innerHTML = `
                    <div class="error-msg">
                        <p><strong>Wystąpił nieoczekiwany problem:</strong> ${error.message}</p>
                    </div>`;
            }
        }

        // --- POBIERANIE W TLE DLA POZOSTAŁYCH ZAKŁADEK ---
        async function prefetchOtherFeeds() {
            for (const key of Object.keys(feeds)) {
                if (!feedCache[key]) {
                    try {
                        const urls = feeds[key];
                        const fetchPromises = urls.map(async (url) => {
                            try {
                                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                                if (!response.ok) return null;
                                const data = await response.json();
                                if (data.status !== 'ok' || !data.items) return null;

                                const sourceName = feedSources[url] || data.feed?.title || 'Wiadomości';
                                const translatedItems = await Promise.all(data.items.map(async (item) => {
                                    let title = item.title || '';
                                    let description = item.description || '';
                                    try {
                                        if (title) title = await translateText(title);
                                        if (description) description = await translateText(description);
                                    } catch (err) {}
                                    return { ...item, title, description, sourceName };
                                }));
                                return translatedItems;
                            } catch (e) { return null; }
                        });
                        const results = await Promise.all(fetchPromises);
                        let combinedItems = [];
                        results.forEach(items => { if (items) combinedItems = combinedItems.concat(items); });
                        combinedItems.sort((a, b) => getTimestamp(b.pubDate) - getTimestamp(a.pubDate));
                        if (combinedItems.length > 0) {
                            feedCache[key] = combinedItems;
                        }
                    } catch (e) {}
                }
            }
        }

        window.onload = () => {
            loadFeed('sciencedaily');
            setTimeout(prefetchOtherFeeds, 2000);
        };
    </script>
</body>
</html>
