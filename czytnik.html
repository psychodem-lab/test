<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czytnik Wiadomości</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --text-main: #e3e6ed;
            --text-muted: #8892b0;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --border: #222530;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        header {
            margin-bottom: 50px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 25px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 500;
            margin: 0 0 20px 0;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        button.active, button:hover {
            border-color: var(--accent);
            color: var(--text-main);
            background-color: rgba(79, 70, 229, 0.1);
        }

        .loader {
            text-align: center;
            color: var(--text-muted);
            margin: 50px 0;
            font-size: 0.9rem;
            display: none;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        article {
            animation: fadeIn 0.4s ease forwards;
        }

        .article-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-title {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
            font-weight: 500;
            line-height: 1.4;
        }

        .article-title a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .article-title a:hover {
            color: var(--accent-hover);
        }

        .article-description {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <header translate="no">
            <h1>Wiadomości</h1>
            <nav>
                <button onclick="loadFeed('sciencedaily')" id="btn-sciencedaily" class="active">ScienceDaily</button>
                <button onclick="loadFeed('pap')" id="btn-pap">Polska</button>
                <button onclick="loadFeed('pl2')" id="btn-pl2">Polska2</button>
                <button onclick="loadFeed('cnn')" id="btn-cnn">Świat</button>
                <button onclick="loadFeed('gazetaru')" id="btn-gazetaru">Ruskie</button>
                <button onclick="loadFeed('psychologia')" id="btn-psychologia">Psychologia</button>
            </nav>
        </header>
        
        <div id="loader" class="loader" translate="no">Tłumaczenie i wczytywanie artykułów...</div>
        <main id="feed" class="feed-container"></main>
    </div>

    <script>
        // Mapa źródeł RSS z czytelnymi nazwami
        const feedSources = {
            'https://www.sciencedaily.com/rss/all.xml': 'ScienceDaily',
            'https://www.sciencedaily.com/rss/top/science.xml': 'ScienceDaily Top',
            'https://www.sciencedaily.com/rss/mind_brain.xml': 'ScienceDaily Mind & Brain',
            'https://www.sciencedaily.com/rss/space_time.xml': 'ScienceDaily Space & Time',
            'https://www.sciencedaily.com/rss/matter_energy.xml': 'ScienceDaily Matter & Energy',
            'https://www.sciencedaily.com/rss/computers_math.xml': 'ScienceDaily Computers & Math',
            'https://www.sciencedaily.com/rss/health_medicine.xml': 'ScienceDaily Health',
            'https://pap-mediaroom.pl/kategoria/zdrowie-i-styl-zycia/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kategoria/nauka-i-technologie/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kategoria/ludzie-i-kultura/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kategoria/polityka-i-społeczenstwo/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kategoria/biznes-i-finanse/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kalendarium/rss.xml': 'PAP',
            'http://feeds.bbci.co.uk/news/rss.xml': 'BBC News',
            'https://news.google.com/rss/search?q=site%3Areuters.com%20when%3A1h&hl=en-US&gl=US&ceid=US%3Aen': 'Reuters',
            'https://www.reutersagency.com/feed/?best-topics=political-general-news&post_type=best': 'Reuters Agency',
            'https://www.gazeta.ru/export/rss/first.xml': 'Gazeta.ru',
            'https://www.polsatnews.pl/rss/wszystkie.xml': 'Polsat News',
            'https://news.google.com/rss?hl=pl&gl=PL&ceid=PL:pl': 'Google News',
            'https://rss.dw.com/xml/rss-pl-pol': 'DW Polska',
            'https://www.polsatsport.pl/rss/wszystkie.xml': 'Polsat Sport',
            'https://www.rynekzdrowia.pl/Kanal/all.xml': 'Rynek Zdrowia',
            'https://news.google.com/rss/search?q=psychologia&hl=pl&gl=PL&ceid=PL:pl': 'Psychologia (Google News)',
            'https://news.google.com/rss/search?q=psychoterapia+OR+pttpb&hl=pl&gl=PL&ceid=PL:pl': 'PTTPB / Psychoterapia',
            'https://news.google.com/rss/search?q=zdrowie+psychiczne&hl=pl&gl=PL&ceid=PL:pl': 'Zdrowie Psychiczne'
        };

        const feeds = {
            sciencedaily: [
                'https://www.sciencedaily.com/rss/all.xml',
                'https://www.sciencedaily.com/rss/top/science.xml',
                'https://www.sciencedaily.com/rss/mind_brain.xml',
                'https://www.sciencedaily.com/rss/space_time.xml',
                'https://www.sciencedaily.com/rss/matter_energy.xml',
                'https://www.sciencedaily.com/rss/computers_math.xml',
                'https://www.sciencedaily.com/rss/health_medicine.xml'
            ],
            pap: [
                'https://pap-mediaroom.pl/kategoria/zdrowie-i-styl-zycia/rss.xml', 
                'https://pap-mediaroom.pl/kategoria/nauka-i-technologie/rss.xml',
                'https://pap-mediaroom.pl/kategoria/ludzie-i-kultura/rss.xml',
                'https://pap-mediaroom.pl/kategoria/polityka-i-społeczenstwo/rss.xml',
                'https://pap-mediaroom.pl/kategoria/biznes-i-finanse/rss.xml',
                'https://pap-mediaroom.pl/kalendarium/rss.xml'
            ],
            cnn: [
                'http://feeds.bbci.co.uk/news/rss.xml',
                'https://news.google.com/rss/search?q=site%3Areuters.com%20when%3A1h&hl=en-US&gl=US&ceid=US%3Aen',
                'https://www.reutersagency.com/feed/?best-topics=political-general-news&post_type=best'
            ],
            gazetaru: [
                'https://www.gazeta.ru/export/rss/first.xml'
            ],
            pl2: [
                'https://www.polsatnews.pl/rss/wszystkie.xml',  
                'https://news.google.com/rss?hl=pl&gl=PL&ceid=PL:pl',
                'https://rss.dw.com/xml/rss-pl-pol',
                'https://www.polsatsport.pl/rss/wszystkie.xml',
                'https://www.rynekzdrowia.pl/Kanal/all.xml'
            ],
            psychologia: [
                'https://news.google.com/rss/search?q=psychologia&hl=pl&gl=PL&ceid=PL:pl',
                'https://news.google.com/rss/search?q=psychoterapia+OR+pttpb&hl=pl&gl=PL&ceid=PL:pl',
                'https://news.google.com/rss/search?q=zdrowie+psychiczne&hl=pl&gl=PL&ceid=PL:pl'
            ]
        };

        // Pamięć podręczna (cache) dla błyskawicznego otwierania zakładek
        const feedCache = {};
        let currentItems = [];
        let displayedCount = 0;
        const batchSize = 10;

        // --- AUTOMATYCZNE TŁUMACZENIE NA JĘZYK POLSKI ---
        async function translateText(text) {
            if (!text) return '';
            const cleanText = text.replace(/<[^>]*>/g, '').trim();
            if (!cleanText) return '';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pl&dt=t&q=${encodeURIComponent(cleanText)}`);
                const data = await res.json();
                if (data && data[0]) {
                    return data[0].map(item => item[0]).join('');
                }
            } catch (e) {}
            return text;
        }

        // --- OBSŁUGA GESTÓW ---
        let touchstartX = 0;
        let touchstartY = 0;
        let touchendX = 0;
        let touchendY = 0;

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleGesture();
        }, { passive: true });

        function handleGesture() {
            const diffX = touchendX - touchstartX;
            const diffY = touchendY - touchstartY;
            const swipeThreshold = 60;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold) {
                const keys = Object.keys(feeds);
                const activeBtn = document.querySelector('nav button.active');
                if (!activeBtn) return;
                
                const currentKey = activeBtn.id.replace('btn-', '');
                let currentIndex = keys.indexOf(currentKey);
                
                if (diffX > 0) {
                    currentIndex = (currentIndex - 1 + keys.length) % keys.length;
                } else {
                    currentIndex = (currentIndex + 1) % keys.length;
                }
                
                loadFeed(keys[currentIndex]);
            }
        }

        // --- POMOCNICZE FUNKCJE DAT ---
        function getTimestamp(dateStr) {
            if (!dateStr) return 0;
            if (dateStr.includes('/')) {
                const match = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                if (match) {
                    return new Date(`${match[3]}-${match[1]}-${match[2]}`).getTime();
                }
            }
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? 0 : d.getTime();
        }

        function parseFeedDate(dateStr) {
            if (!dateStr) return 'Brak daty';
            if (dateStr.includes('/')) {
                const match = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                if (match) {
                    const dateObj = new Date(`${match[3]}-${match[1]}-${match[2]}`);
                    if (!isNaN(dateObj)) return formatDate(dateObj);
                }
            }
            const dateObj = new Date(dateStr);
            if (!isNaN(dateObj)) return formatDate(dateObj);
            return dateStr.replace(/^[a-złżóćęąśń.,\s]+/i, '');
        }

        function formatDate(dateObj) {
            return dateObj.toLocaleDateString('pl-PL', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // --- RENDEROWANIE ARTYKUŁÓW (NEVER ENDING SCROLLING) ---
        function renderArticles(items, container, append = false) {
            if (!append) {
                container.innerHTML = '';
                displayedCount = 0;
            }

            const slice = items.slice(displayedCount, displayedCount + batchSize);
            if (slice.length === 0) return;

            slice.forEach(item => {
                const article = document.createElement('article');
                const pubDate = parseFeedDate(item.pubDate);
                const sourceName = item.sourceName || 'Wiadomości';

                let cleanDescription = item.description || '';
                cleanDescription = cleanDescription.replace(/<[^>]*>/g, '').trim();

                article.innerHTML = `
                    <div class="article-meta" translate="no">${pubDate} &bull; ${sourceName}</div>
                    <h2 class="article-title">
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                    </h2>
                    ${cleanDescription ? `<p class="article-description">${cleanDescription}</p>` : ''}
                `;
                container.appendChild(article);
            });

            displayedCount += slice.length;
        }

        // --- OBSŁUGA SCROLLOWANIA (NIESKOŃCZONE przewijanie) ---
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 400) {
                if (currentItems.length > 0 && displayedCount < currentItems.length) {
                    const feedContainer = document.getElementById('feed');
                    renderArticles(currentItems, feedContainer, true);
                }
            }
        });

        // --- GŁÓWNA FUNKCJA POBIERANIA Z TŁUMACZENIEM I CACHINGIEM ---
        async function loadFeed(sourceKey) {
            const loader = document.getElementById('loader');
            const feedContainer = document.getElementById('feed');
            
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${sourceKey}`).classList.add('active');

            // Jeśli dane są w pamięci podręcznej, otwórz natychmiast (0ms)
            if (feedCache[sourceKey]) {
                loader.style.display = 'none';
                currentItems = feedCache[sourceKey];
                renderArticles(currentItems, feedContainer, false);
                return;
            }

            loader.style.display = 'block';
            feedContainer.innerHTML = '';
            displayedCount = 0;
            currentItems = [];
            
            try {
                const urls = feeds[sourceKey];
                const fetchPromises = urls.map(async (url) => {
                    try {
                        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                        if (!response.ok) return null;
                        const data = await response.json();
                        if (data.status !== 'ok' || !data.items) return null;
                        
                        const sourceName = feedSources[url] || data.feed?.title || 'Wiadomości';

                        // Automatyczne tłumaczenie tytułów i opisów na język polski
                        const translatedItems = await Promise.all(data.items.map(async (item) => {
                            let title = item.title || '';
                            let description = item.description || '';
                            
                            try {
                                if (title) title = await translateText(title);
                                if (description) description = await translateText(description);
                            } catch (err) {}

                            return {
                                ...item,
                                title,
                                description,
                                sourceName
                            };
                        }));

                        return translatedItems;
                    } catch (e) {
                        return null;
                    }
                });

                const results = await Promise.all(fetchPromises);
                
                let combinedItems = [];
                results.forEach(items => {
                    if (items) combinedItems = combinedItems.concat(items);
                });
                
                loader.style.display = 'none';
                
                if (combinedItems.length === 0) {
                    feedContainer.innerHTML = '<p class="text-muted">Nie udało się wczytać żadnych artykułów.</p>';
                    return;
                }

                combinedItems.sort((a, b) => getTimestamp(b.pubDate) - getTimestamp(a.pubDate));
                
                // Zapisz w cache przetłumaczone artykuły
                feedCache[sourceKey] = combinedItems;
                currentItems = combinedItems;
                renderArticles(currentItems, feedContainer, false);

            } catch (error) {
                loader.style.display = 'none';
                feedContainer.innerHTML = `
                    <div class="error-msg">
                        <p><strong>Wystąpił nieoczekiwany problem:</strong> ${error.message}</p>
                    </div>`;
            }
        }

        // --- POBIERANIE W TLE DLA POZOSTAŁYCH ZAKŁADEK ---
        async function prefetchOtherFeeds() {
            for (const key of Object.keys(feeds)) {
                if (!feedCache[key]) {
                    try {
                        const urls = feeds[key];
                        const fetchPromises = urls.map(async (url) => {
                            try {
                                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                                if (!response.ok) return null;
                                const data = await response.json();
                                if (data.status !== 'ok' || !data.items) return null;

                                const sourceName = feedSources[url] || data.feed?.title || 'Wiadomości';
                                const translatedItems = await Promise.all(data.items.map(async (item) => {
                                    let title = item.title || '';
                                    let description = item.description || '';
                                    try {
                                        if (title) title = await translateText(title);
                                        if (description) description = await translateText(description);
                                    } catch (err) {}
                                    return { ...item, title, description, sourceName };
                                }));
                                return translatedItems;
                            } catch (e) { return null; }
                        });
                        const results = await Promise.all(fetchPromises);
                        let combinedItems = [];
                        results.forEach(items => { if (items) combinedItems = combinedItems.concat(items); });
                        combinedItems.sort((a, b) => getTimestamp(b.pubDate) - getTimestamp(a.pubDate));
                        if (combinedItems.length > 0) {
                            feedCache[key] = combinedItems;
                        }
                    } catch (e) {}
                }
            }
        }

        window.onload = () => {
            loadFeed('sciencedaily');
            setTimeout(prefetchOtherFeeds, 2000);
        };
    </script>
</body>
</html>
